name: Build Windows EXE

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Python 3.13 をセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: PyInstaller をインストール
        run: pip install pyinstaller

      - name: EXE をビルド
        run: pyinstaller GanttApp.spec --clean --noconfirm

      - name: 配布フォルダを整える
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist\GanttApp\save
          Copy-Item -Path "README_配布用.txt" -Destination "dist\GanttApp\" -ErrorAction SilentlyContinue

      - name: バージョン名を取得
        id: ver
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          echo "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: ZIP に圧縮
        shell: pwsh
        run: |
          $zip = "GanttApp_${{ steps.ver.outputs.tag }}.zip"
          Compress-Archive -Path dist\GanttApp\* -DestinationPath $zip
          echo "ZIP_NAME=$zip" >> $env:GITHUB_ENV

      - name: GitHub Release を作成して ZIP を添付
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "GanttApp ${{ github.ref_name }}"
          files: ${{ env.ZIP_NAME }}
          generate_release_notes: false
