name: Build Windows EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Python 3.13 をセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: PyInstaller をインストール
        run: pip install pyinstaller

      - name: EXE をビルド
        run: pyinstaller GanttApp.spec --clean --noconfirm

      - name: 配布フォルダを整える
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist\GanttApp\save
          Copy-Item -Path "README_配布用.txt" -Destination "dist\GanttApp\" -ErrorAction SilentlyContinue

      - name: ZIP に圧縮
        shell: pwsh
        run: |
          Compress-Archive -Path dist\GanttApp\* -DestinationPath GanttApp_v1.zip

      - name: ZIP をアップロード
        uses: actions/upload-artifact@v4
        with:
          name: GanttApp_v1
          path: GanttApp_v1.zip
          retention-days: 90
