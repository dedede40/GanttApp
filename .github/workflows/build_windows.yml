name: Build Windows EXE

on:
  push:
    branches: [main]
  workflow_dispatch:   # 手動実行ボタンも有効化

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Python 3.13 をセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: PyInstaller をインストール
        run: pip install pyinstaller

      - name: EXE をビルド
        run: pyinstaller GanttApp.spec --clean --noconfirm

      - name: save フォルダを追加
        run: New-Item -ItemType Directory -Force -Path dist\GanttApp\save
        shell: pwsh

      - name: ビルド成果物をアップロード
        uses: actions/upload-artifact@v4
        with:
          name: GanttApp-Windows
          path: dist\GanttApp\
          retention-days: 30
